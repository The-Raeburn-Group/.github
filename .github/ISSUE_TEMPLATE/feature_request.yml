name: Feature request
description: Suggest an improvement or new capability
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape a project maintained through The Raeburn Group GitHub organisation.
  - type: input
    id: repo
    attributes:
      label: Repository or project
      description: Which repository or project would this affect?
      placeholder: Repository name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem would this solve or what opportunity would it create?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What change or capability are you proposing?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who needs this and how would they use it?
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Low
        - Medium
        - High
        - Critical
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include relevant examples, constraints, screenshots or links. Do not include secrets or personal/confidential data.
