name: Bug report
description: Report a reproducible problem
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve a project maintained through The Raeburn Group GitHub organisation.
  - type: input
    id: repo
    attributes:
      label: Repository or project
      description: Which repository or project is affected?
      placeholder: Repository name
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide clear steps to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, browser, language/runtime versions, deployment target, provider or other relevant environment details.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add redacted logs, screenshots, stack traces or API responses if useful. Do not include secrets or personal/confidential data.
      render: shell
